services:
  # UI dashboard
  dashboard:
    image: netbirdio/dashboard:latest
    container_name: netbird-dashboard
    restart: unless-stopped
    networks: [netbird]
    ports:
      - "0.0.0.0:8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

  # Combined server (Management + Signal + Relay + STUN)
  netbird-server:
    image: netbirdio/netbird-server:latest
    container_name: netbird-server
    restart: unless-stopped
    networks: [netbird, postgres-network]
    ports:
      - "0.0.0.0:8081:80"
      - "3478:3478/udp"
    volumes:
      - ~${DOCKER_DATA_PATH}:/var/lib/netbird
      - ${DOCKER_DATA_PATH}/config.yaml:/etc/netbird/config.yaml
    command: ["--config", "/etc/netbird/config.yaml"]
    logging:
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "2"

volumes:
  netbird_data:

networks:
  netbird:
  postgres-network:
    external: true
    name: ${POSTGRES_NETWORK_NAME:?POSTGRES_NETWORK_NAME must be set}
