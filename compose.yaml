networks:
  netbird:
    external: false

services:
  netbird:
    image: netbirdio/netbird-server:${NETBIRD_TAG:-0.75.0}
    container_name: netbird
    restart: unless-stopped
    env_file:
      - .env
    command: ["--config", "/etc/netbird/config.yaml"]
    volumes:
      - ${DOCKER_DATA_PATH}/data:/var/lib/netbird
      - ./config.yaml:/etc/netbird/config.yaml:ro
    ports:
      # HTTP/gRPC (management + signal + relay). Bound to the host's LAN IP so
      # nginx-proxy-manager (on a different host) can reach it. Set
      # NETBIRD_HTTP_BIND in .env to restrict which interface accepts traffic;
      # keep it off 0.0.0.0 so this port isn't blanket-exposed.
      - "${NETBIRD_HTTP_BIND:-127.0.0.1}:${NETBIRD_HTTP_PORT:-8081}:443"
      # STUN — MUST be publicly reachable (UDP), cannot be reverse-proxied.
      - "${NETBIRD_STUN_PORT:-3478}:3478/udp"
      # Metrics — localhost-only.
      - "127.0.0.1:${NETBIRD_METRICS_PORT:-9090}:9090"
    networks:
      - netbird
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dashboard:
    image: netbirdio/dashboard:${NETBIRD_DASHBOARD_TAG:-latest}
    container_name: netbird-dashboard
    restart: unless-stopped
    environment:
      # REST + gRPC API endpoints — both point at the public NetBird URL, since
      # NPM routes /api/* and /management.*/ to the netbird-server container.
      NETBIRD_MGMT_API_ENDPOINT: ${NETBIRD_MGMT_API_ENDPOINT:?public NetBird URL required}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: ${NETBIRD_MGMT_API_ENDPOINT}
      # Embedded Dex IdP — client ID/audience are fixed literals the server expects.
      AUTH_AUDIENCE: netbird-dashboard
      AUTH_CLIENT_ID: netbird-dashboard
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: ${NETBIRD_MGMT_API_ENDPOINT}/oauth2
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: "openid profile email groups"
      AUTH_REDIRECT_URI: /nb-auth
      AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
      # NPM terminates TLS, so disable the dashboard's built-in ACME.
      NGINX_SSL_PORT: "443"
      LETSENCRYPT_DOMAIN: "none"
    ports:
      # Dashboard SPA on plain HTTP for NPM to reverse-proxy. Same bind rules as
      # the backend — LAN IP when NPM is on another host.
      - "${NETBIRD_HTTP_BIND:-127.0.0.1}:${NETBIRD_DASHBOARD_PORT:-8082}:80"
    networks:
      - netbird

  db:
    image: postgres:${POSTGRES_TAG:-17}
    container_name: netbird-db
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_DB: ${POSTGRES_DB:-netbird}
      POSTGRES_USER: ${POSTGRES_USER:-netbird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - netbird
    volumes:
      - ${DOCKER_DATA_PATH}/postgres:/var/lib/postgresql/data
